<style>
:root {
  /* the whole page is one still setting; the living scene shows through an uneven soft opening in its middle. One typeface, two lines of words. */
  --ink: #0E2A44; --under: #082659;
  --body: 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --out: cubic-bezier(0.22, 1, 0.36, 1);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { background: var(--under); color: var(--ink); font-family: var(--body); font-size: 13px; line-height: 1.5; font-synthesis: none; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
h1, p { font: inherit; margin: 0; }
h1 { font-weight: 500; }
.stage { position: fixed; inset: 0; transition: opacity 0.16s ease-out; }
.stage.swap, .stage.wait { opacity: 0; }
#box { position: absolute; }
#box canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: default !important; }
#box canvas[hidden] { display: none; }
#set { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
#set[hidden], #still[hidden] { display: none; }
.stage.over #box { z-index: 2; }
#still { position: absolute; display: block; max-width: none; pointer-events: none; user-select: none; -webkit-user-select: none; }
#still { --fx: linear-gradient(#000, #000); --fy: linear-gradient(#000, #000); -webkit-mask-image: var(--fx), var(--fy); mask-image: var(--fx), var(--fy); -webkit-mask-composite: source-in; mask-composite: intersect; }
.stage.fx #still { --fx: linear-gradient(to right, transparent, #000 12%, #000 88%, transparent); }
.stage.fy #still { --fy: linear-gradient(to bottom, transparent, #000 6%, #000 94%, transparent); }
:root.pic .words { text-shadow: 0 1px 10px rgba(0, 0, 0, 0.35); }
:root.pic.dark .words { text-shadow: none; }
:root.plate .nav, :root.plate .count { background: color-mix(in srgb, var(--plate) 86%, transparent); border-radius: 12px; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.18); }
:root.plate .count { padding: 4px 10px; opacity: 1; }
.err { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; }
.words { position: fixed; inset: 0; pointer-events: none; display: grid; grid-template-rows: auto 1fr auto; padding: 22px 26px; }
.top > *, .bar > * { pointer-events: auto; } /* only the words and buttons themselves take the pointer: the rows they sit in let it through to a scene that covers the page */
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; min-height: 30px; }
.bar { grid-row: 3; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
.nav { grid-column: 2; display: flex; align-items: center; gap: 4px; }
#name { min-width: 11.5em; text-align: center; font-size: 15px; font-weight: 500; letter-spacing: -0.01em; }
.count { grid-column: 3; justify-self: end; font-variant-numeric: tabular-nums; opacity: 0.72; }
.icon { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px; transition: background-color 0.15s ease-out, transform 0.15s var(--out); }
.icon:hover { background: color-mix(in srgb, var(--ink) 12%, transparent); }
.icon:active, .chip:active { transform: scale(0.96); }
.chips { display: flex; gap: 2px; }
#stills { grid-column: 1; justify-self: start; }
.chips[hidden] { display: none; }
.chip { height: 30px; padding: 0 10px; border-radius: 8px; opacity: 0.66; user-select: none; -webkit-user-select: none; transition: opacity 0.15s ease-out, background-color 0.15s ease-out; }
.chip:hover, .chip[aria-pressed="true"] { opacity: 1; }
.chip[aria-pressed="true"] { background: color-mix(in srgb, var(--ink) 13%, transparent); }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
@media (max-width: 640px) {
  body { font-size: 14px; }
  .words { padding: 16px 14px 14px; }
  .bar { grid-template-columns: 1fr; justify-items: center; gap: 0; }
  .nav, #stills, .count { grid-column: 1; } #stills { justify-self: center; order: 2; }
  .count { display: none; }
  .icon { width: 44px; height: 44px; } .chip { height: 44px; }
}
@media (prefers-reduced-motion: reduce) { .stage, .icon, .chip { transition: none; } .icon:active, .chip:active { transform: none; } }
